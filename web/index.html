<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Level Editor</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles/ink.css"><link rel="stylesheet" href="app.css"></head><body>
<div id="app"><header><img src="icon.svg" alt=""><strong>Level Editor</strong><span class="header-line"></span><select id="maps" aria-label="Map"></select><button id="new-map" title="New map">＋ New</button><span class="spacer"></span><span id="save" role="status">Connecting…</span><button id="import-map">Import</button><button id="export-map">Export</button><button id="more" aria-label="Map settings">•••</button></header>
<div class="toolbar"><div class="tools" role="toolbar" aria-label="Map tools"><button data-tool="brush" aria-label="Brush" title="Brush · B"><svg viewBox="0 0 24 24"><path d="m15 3 6 6-9 9-6-6ZM6 12l-3 9 9-3"/></svg></button><button data-tool="erase" aria-label="Eraser" title="Eraser · E"><svg viewBox="0 0 24 24"><path d="m15 3 6 6-11 12H5l-3-4ZM7 12l7 7M10 21h12"/></svg></button><button data-tool="fill" aria-label="Fill" title="Fill · F"><svg viewBox="0 0 24 24"><path d="m12 3 8 8-9 9-9-9ZM5 2l7 7M4 13h13M21 16c3 4 0 7-2 4-1-1 0-3 2-4"/></svg></button><button data-tool="rect" aria-label="Rectangle" title="Rectangle · R"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></svg></button><button data-tool="pick" aria-label="Eyedropper" title="Eyedropper · I"><svg viewBox="0 0 24 24"><path d="m15 3 6 6M18 6 6 18l-3 3v-5L15 3"/></svg></button><button data-tool="inspect" aria-label="Inspect tile" title="Inspect tile · S"><svg viewBox="0 0 24 24"><path d="m5 3 14 10-7 1-3 7Z"/></svg></button><button data-tool="pan" aria-label="Pan" title="Pan · H or hold Space"><svg viewBox="0 0 24 24"><path d="M8 11V5a2 2 0 0 1 4 0v5-6a2 2 0 0 1 4 0v6-3a2 2 0 0 1 4 0v8c0 5-4 7-7 7-3 0-5-2-7-5l-3-4a2 2 0 0 1 3-2l2 2"/></svg></button></div><span class="divider"></span><button id="undo" aria-label="Undo my edit" title="Undo my edit · ⌘/Ctrl Z">↶</button><button id="redo" aria-label="Redo my edit" title="Redo · ⌘/Ctrl Shift Z">↷</button><span class="divider"></span><button id="flip-h" aria-label="Flip brush horizontally" title="Flip horizontally · X">↔</button><button id="flip-v" aria-label="Flip brush vertically" title="Flip vertically · Y">↕</button><button id="rotate" aria-label="Rotate brush" title="Rotate clockwise">↻</button><span class="spacer"></span><label class="check"><input id="grid" type="checkbox" checked>Grid</label><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit" title="Fit map">100%</button><button id="zoom-in" aria-label="Zoom in">＋</button></div>
<div class="workspace"><aside id="palette-panel"><div class="section-heading"><h2>Tilesets</h2><button id="add-tileset" aria-label="Import tileset" title="Import tileset">＋</button></div><select id="tilesets" aria-label="Tileset"></select><div id="palette-scroll"><div id="palette-content"><canvas id="palette" tabindex="0" aria-label="Tileset palette"></canvas></div></div><div id="tile-info" class="small">Select a tile or drag a stamp</div><div class="palette-actions"><button id="pick-ink">Choose from Ink</button><button id="tileset-settings" aria-label="Tileset settings">⚙</button></div><div class="sidebar-foot"><span class="live-dot"></span> Shared map · personal camera</div></aside>
<main id="viewport"><canvas id="map" tabindex="0" aria-label="Level map canvas"></canvas><div id="map-empty"><strong>Build somewhere new.</strong><span>Choose a tile, then paint on the map.</span><button id="sample">Create a sample clearing</button></div><div id="canvas-hud"><span id="position">—</span><span id="dimensions">32 × 24</span></div><div id="load-cover">Opening shared map…</div></main>
<aside id="inspector"><section class="layer-section"><div class="section-heading"><h2>Layers</h2><button id="add-layer" aria-label="Add layer">＋</button></div><div id="layers" role="list" aria-label="Map layers"></div><div class="layer-controls"><button id="layer-up" aria-label="Move layer up">↑</button><button id="layer-down" aria-label="Move layer down">↓</button><button id="layer-rename" title="Rename layer">Rename</button><button id="layer-delete" aria-label="Delete layer">−</button></div><label class="opacity">Opacity <input id="opacity" type="range" min="0" max="100" value="100"><output id="opacity-value">100%</output></label></section>
<section class="properties-section"><div class="section-heading"><h2>Properties</h2><button id="add-property" aria-label="Add property">＋</button></div><div class="property-tabs" role="tablist" aria-label="Property target"><button data-scope="map" role="tab">Map</button><button data-scope="layer" role="tab">Layer</button><button data-scope="tile" role="tab">Tile</button><button data-scope="cell" role="tab">Placed</button></div><div id="property-target"></div><div id="properties"></div></section></aside></div>
<footer><button id="palette-toggle">Tilesets</button><span id="tool-hint">Brush · drag to paint · Space to pan</span><span class="spacer"></span><span id="remote-status"></span><button id="inspector-toggle">Layers & properties</button></footer></div>
<div id="toast" role="status" hidden></div><dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" aria-label="Close dialog">×</button></div><div id="dialog-body"></div><p id="dialog-error" role="alert"></p><div class="dialog-actions"><button type="button" id="dialog-cancel">Cancel</button><button type="submit" class="primary" id="dialog-submit">Save</button></div></form></dialog><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="map-input" type="file" accept=".inkmap,.json,application/json" hidden><script type="module" src="app.mjs"></script></body></html>
